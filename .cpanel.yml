---
# Deploy tự động khi bấm "Deploy HEAD Commit" trong cPanel → Git™ Version Control.
# ĐỔI DEPLOYPATH thành thư mục web thật (document root của domain/subdomain chạy tool),
# ví dụ /home/abcuser/public_html/ hoặc /home/abcuser/seo.congty.com/  (nhớ dấu / ở cuối)
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANEL_USER/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R app assets cron database index.php .htaccess composer.json $DEPLOYPATH
    - /bin/mkdir -p ${DEPLOYPATH}uploads ${DEPLOYPATH}storage/logs
    - /bin/cp uploads/.htaccess ${DEPLOYPATH}uploads/
    - /bin/cp storage/.htaccess ${DEPLOYPATH}storage/
    - cd $DEPLOYPATH && (/opt/cpanel/composer/bin/composer install --no-dev --no-interaction --optimize-autoloader || composer install --no-dev --no-interaction --optimize-autoloader || echo "Khong chay duoc composer - xem README")
